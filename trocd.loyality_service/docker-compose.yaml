services:
  loyalty-db-postgres:
    image: postgres:17
    container_name: loyalty-db-postgres
    restart: on-failure
    environment:
      POSTGRES_DB: loyalty-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - loyalty_db_postgres_data:/var/lib/postgresql/data

volumes:
  loyalty_db_postgres_data:
