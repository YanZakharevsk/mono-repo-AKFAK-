spring:
  application:
    name: trocd.loyality_service

  datasource:
    url: jdbc:postgresql://localhost:5434/loyalty-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      concurrency: 3
    consumer:
      group-id: loyalty-group-id
      properties:
        spring:
          json:
            trusted:
              packages: "*"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

    admin:
      properties:
        partitions: 3
        replication-factor: 1








server:
  port: 8082
